<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago Cancelado — Aprobados YA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style_v2.css?v=6">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); margin: 0; font-family: 'Inter', sans-serif; text-align: center; }
    .cancel-card { background: var(--card); padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px var(--shadow); max-width: 400px; width: 90%; }
    .cancel-icon { font-size: 60px; margin-bottom: 20px; }
    h1 { color: var(--text); font-size: 24px; margin-bottom: 10px; }
    p { color: var(--text2); font-size: 16px; margin-bottom: 30px; line-height: 1.5; }
    .btn { display: inline-block; background: var(--olive); color: white; padding: 14px 24px; border-radius: 12px; text-decoration: none; font-weight: 600; width: 100%; box-sizing: border-box; transition: opacity 0.2s; margin-bottom: 12px; }
    .btn:hover { opacity: 0.9; }
    .btn-outline { background: transparent; color: var(--text); border: 2px solid var(--border); }
  </style>
</head>
<body>
  <div class="cancel-card">
    <div class="cancel-icon">💬</div>
    <h1>Proceso cancelado</h1>
    <p>El proceso de pago se ha interrumpido y no se te ha cobrado nada. Puedes volver a intentarlo cuando quieras.</p>
    <a href="/" class="btn btn-outline">Volver al inicio</a>
  </div>
</body>
</html>
